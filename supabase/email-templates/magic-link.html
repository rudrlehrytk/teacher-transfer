<!-- 제목(Subject): [관외전보 모의지원] 로그인 링크가 도착했어요 -->
<div style="font-family: 'Apple SD Gothic Neo','Malgun Gothic',sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #1d2a26; line-height: 1.6;">
  <h2 style="margin: 0 0 12px; font-size: 20px;">경기 관외전보 모의지원 로그인</h2>
  <p style="margin: 0 0 16px;">안녕하세요, 선생님. 아래 버튼을 누르면 모의지원 페이지로 돌아가면서 바로 로그인돼요.</p>
  <p style="margin: 0 0 20px;">
    <a href="{{ .ConfirmationURL }}" style="display: inline-block; background: #1f6b5a; color: #ffffff; text-decoration: none; font-weight: bold; padding: 12px 22px; border-radius: 6px;">로그인하기</a>
  </p>
  <ul style="margin: 0 0 16px; padding-left: 18px; font-size: 14px; color: #5d6b66;">
    <li>링크는 한 번만 쓸 수 있고, 1시간이 지나면 만료돼요.</li>
    <li>로그인 링크를 요청한 기기·브라우저에서 눌러 주세요.</li>
    <li>요청하지 않으셨다면 이 메일은 무시하셔도 괜찮아요.</li>
  </ul>
  <p style="margin: 0; font-size: 12px; color: #8a9893;">이 서비스는 경기도교육청의 공식 서비스가 아니에요. 점수와 순위는 참고용입니다.</p>
</div>
